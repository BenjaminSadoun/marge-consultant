<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Marge consultant</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-card">

  <h1 id="brand-title" class="brand-title">Marge consultant</h1>

  <div class="top-row">
    <select id="country" class="select">
      <option value="fr" data-cm="1.47" data-awd="220">France</option>
      <option value="es" data-cm="1.34" data-awd="220">Espagne</option>
      <option value="it" data-cm="1.40" data-awd="220">Italie</option>
      <option value="ch" data-cm="1.18" data-awd="230">Suisse</option>
      <option value="be" data-cm="1.41" data-awd="230">Belgique et Lux</option>
    </select>
    <select id="lang" class="select lang-select">
      <option value="fr">FR</option>
      <option value="en">EN</option>
      <option value="it">IT</option>
      <option value="es">ES</option>
    </select>
  </div>

  <div id="seg" class="segmented">
    <button type="button" data-value="internal">Interne</button>
    <button type="button" data-value="external">Externe</button>
  </div>

  <div id="seg-ext-mode" class="segmented sub-segmented" hidden>
    <button type="button" data-value="portage">Portage salarial</button>
    <button type="button" data-value="freelance">Freelance</button>
  </div>

  <div class="fields-grid">
    <div class="field">
      <label id="lbl-sales">TJM vente</label>
      <input id="sales" type="number" min="0" step="1" inputmode="decimal">
    </div>
    <div class="field">
      <label id="lbl-dly">Frais quotidiens</label>
      <input id="dlycost" type="number" min="0" step="1" inputmode="decimal">
    </div>
    <div class="field field-internal">
      <label id="lbl-salary">Salaire brut annuel</label>
      <input id="salary" type="number" min="0" step="100" inputmode="decimal">
    </div>
    <div class="field field-external">
      <label id="lbl-purchase">TJM achat</label>
      <input id="purchase" type="number" min="0" step="1" inputmode="decimal">
    </div>
  </div>

  <div class="result">
    <div class="gauge-block" id="gauge-block-op">
      <span class="gauge-label" id="lbl-margin-op">Marge opérationnelle</span>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="58" fill="none" stroke-width="12" class="gauge-track"></circle>
        <circle id="ring-op" cx="70" cy="70" r="58" fill="none" stroke-width="12" stroke-linecap="round" transform="rotate(-90 70 70)"></circle>
        <text id="pct-op" x="70" y="77" text-anchor="middle" font-size="28">0%</text>
      </svg>
      <span id="val-op" class="margin-value">0 € / jour</span>
    </div>
    <div class="gauge-block" id="gauge-block-k2" hidden>
      <span class="gauge-label" id="lbl-margin-k2">Marge K2</span>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="58" fill="none" stroke-width="12" class="gauge-track"></circle>
        <circle id="ring-k2" cx="70" cy="70" r="58" fill="none" stroke-width="12" stroke-linecap="round" transform="rotate(-90 70 70)"></circle>
        <text id="pct-k2" x="70" y="77" text-anchor="middle" font-size="28">0%</text>
      </svg>
      <span id="val-k2" class="margin-value">0 € / jour</span>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
